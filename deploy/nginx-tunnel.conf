# ============================================================
# FondOntology 反向隧道模式的 nginx 配置
#
# 架构：
#   访客 → 服务器:80 (nginx, 敲门路径+密码+404隐藏) → 隧道 5173 → 本机 5173 (webui)
#
# 安装：
#   cp nginx-tunnel.conf /etc/nginx/sites-available/fondontology
#   ln -sf /etc/nginx/sites-available/fondontology /etc/nginx/sites-enabled/
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#
# 注意：使用前请替换敲门路径与 cookie 值为你自己的随机串
# ============================================================

server {
    listen 80;
    server_name _;

    # --------------------------------------------------------
    # 敲门路径：先校验密码，通过后才种 cookie 并跳回首页
    #
    # 关键点：这里必须用 try_files 而不是 return！
    # nginx 处理顺序：重写阶段(return/if) → 访问阶段(auth_basic) → 内容阶段
    # 若用 return，会在密码校验之前就跳转，导致密码形同虚设（任何人知道路径即可进）
    # try_files 在访问阶段之后执行，保证 auth_basic 先跑完
    # --------------------------------------------------------
    location = /dashboard {
        auth_basic "FondOntology";
        auth_basic_user_file /etc/nginx/.htpasswd_fondontology;
        try_files /nonexistent @knock;
    }
    location @knock {
        add_header Set-Cookie "fo=V7k2m9pLx; Path=/; HttpOnly; SameSite=Strict" always;
        return 302 /;
    }

    # --------------------------------------------------------
    # SSE 流式问答接口（/api/qa/ask/stream 等）
    # 必须关闭缓冲，否则逐字输出会被 nginx 攒着，前端表现为
    # "转圈半天后一次性蹦出全文"
    # --------------------------------------------------------
    location /api/ {
        if ($cookie_fo != "V7k2m9pLx") { return 404; }

        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";

        proxy_buffering off;      # SSE 关键：禁止缓冲响应
        proxy_cache off;
        gzip off;                 # gzip 同样会缓冲，必须关
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering "no" always;

        # LLM 长推理实测可达 145s，超时给足
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # --------------------------------------------------------
    # 主页面与其它请求（含 /viewer/ iframe 内嵌页）
    # 未种 cookie 一律 404，扫描器看不出这里有服务
    # --------------------------------------------------------
    location / {
        if ($cookie_fo != "V7k2m9pLx") { return 404; }

        proxy_pass http://127.0.0.1:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
