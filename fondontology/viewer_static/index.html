<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>中国基金本体浏览器</title>
  <style>
    :root{--ink:#172126;--muted:#66747b;--line:#d9e0e0;--soft:#f4f7f6;--paper:#fbfcfb;--white:#fff;--teal:#116b68;--teal-dark:#0c504e;--teal-soft:#e0f0ee;--blue-soft:#e9f0f8;--shadow:0 12px 32px rgba(23,33,38,.08);font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--paper)}
    *{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{margin:0;min-width:1120px;background:var(--paper)}button,input{font:inherit}button{cursor:pointer}
    .app-shell{height:100vh;display:grid;grid-template-rows:70px minmax(0,1fr)}.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 30px;background:var(--white);border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:14px}.brand-mark{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--teal);color:var(--teal);font-weight:700;border-radius:4px}.brand h1{font-size:18px;margin:0;font-weight:650}.brand p{margin:3px 0 0;color:var(--muted);font-size:12px}.status{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:12px}.status-dot{width:8px;height:8px;border-radius:50%;background:#3d9d77}
    .workspace{display:grid;grid-template-columns:292px minmax(560px,1fr) 330px;min-height:0;height:100%;overflow:hidden}.sidebar,.inspector{background:var(--white);min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable}.sidebar{border-right:1px solid var(--line);padding:24px 18px}.inspector{border-left:1px solid var(--line);padding:24px 20px}.main{min-width:0;min-height:0;height:100%;overflow-y:auto;overscroll-behavior:contain;padding:26px 34px 50px}
    .eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:10px;color:var(--muted);font-weight:700}.panel-title{margin:6px 0 17px;font-size:17px;font-weight:650}.search-box{position:relative}.search-box input{width:100%;height:42px;padding:0 39px 0 13px;border:1px solid var(--line);border-radius:4px;color:var(--ink);background:var(--paper);outline:none}.search-box input:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}.search-icon{position:absolute;right:13px;top:11px;color:var(--muted);font-size:16px}
    .scope-tabs{display:flex;gap:4px;margin:14px 0 18px}.scope-tabs button{border:1px solid transparent;background:transparent;color:var(--muted);padding:6px 9px;border-radius:3px;font-size:12px}.scope-tabs button.active{background:var(--teal-soft);color:var(--teal-dark);border-color:#b8d8d4;font-weight:650}.results{display:grid;gap:4px}.result-item{text-align:left;width:100%;padding:10px 11px;border:1px solid transparent;border-radius:4px;color:var(--ink);background:transparent}.result-item:hover{background:var(--soft);border-color:var(--line)}.result-item.selected{background:var(--teal-soft);border-color:#b8d8d4}.result-label{display:block;font-size:13px;font-weight:620;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.result-meta{display:flex;gap:6px;align-items:center;margin-top:5px;color:var(--muted);font-size:10px}.source-pill,.type-pill{display:inline-flex;align-items:center;border:1px solid var(--line);padding:2px 5px;border-radius:3px;color:var(--muted);background:var(--white);font-size:10px}.source-pill.cnfo{color:var(--teal-dark);border-color:#b8d8d4;background:var(--teal-soft)}.empty{color:var(--muted);font-size:12px;line-height:1.65;padding:15px 4px}
    .breadcrumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:22px;color:var(--muted);font-size:12px}.breadcrumbs button{border:0;background:transparent;padding:0;color:var(--teal)}.breadcrumbs .current{color:var(--ink);font-weight:620}.hero{display:flex;justify-content:space-between;align-items:flex-start;margin:17px 0 24px;gap:20px}.hero h2{margin:0;font-size:30px;line-height:1.2;font-weight:680}.hero p{margin:9px 0 0;color:var(--muted);line-height:1.65;max-width:720px;font-size:13px}.hero-actions{display:flex;gap:8px;flex:0 0 auto}.quiet-button{border:1px solid var(--line);background:var(--white);color:var(--ink);border-radius:4px;padding:8px 11px;font-size:12px}.quiet-button:hover{border-color:var(--teal);color:var(--teal-dark)}.identity-line{display:flex;align-items:center;gap:8px;margin-top:12px}.identity-line code{color:var(--muted);font-size:11px;word-break:break-all}.notice{background:#fbf0dc;border-left:3px solid #d48b2b;padding:11px 13px;color:#704a1c;font-size:12px;line-height:1.6;margin-bottom:20px}
    .section{margin-top:24px}.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}.section-head h3{margin:0;font-size:14px;font-weight:680}.section-head span{color:var(--muted);font-size:11px}.relation-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.relation-card{position:relative;text-align:left;min-height:94px;padding:14px 15px 12px;border:1px solid var(--line);background:var(--white);border-radius:5px;box-shadow:0 3px 10px rgba(23,33,38,.025)}.relation-card:hover{border-color:var(--teal);box-shadow:var(--shadow);transform:translateY(-1px)}.relation-card .relation-kind{color:var(--muted);font-size:10px;margin-bottom:9px;text-transform:uppercase;letter-spacing:.06em}.relation-card strong{display:block;font-size:14px;line-height:1.35}.relation-card small{display:block;color:var(--muted);margin-top:7px;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.relation-card.cnfo{border-top:3px solid var(--teal)}.relation-card .arrow{position:absolute;right:13px;top:13px;color:var(--teal)}.empty-relation{padding:18px;background:var(--soft);color:var(--muted);font-size:12px;border-radius:4px}
    .property-table{width:100%;border-collapse:collapse;background:var(--white);border:1px solid var(--line);font-size:12px}.property-table th,.property-table td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}.property-table th{width:25%;color:var(--muted);font-size:11px;font-weight:600;background:var(--soft)}.property-table tr:last-child th,.property-table tr:last-child td{border-bottom:0}.property-link{border:0;padding:0;background:transparent;color:var(--teal);text-align:left}.property-link:hover{text-decoration:underline}.inspector h2{font-size:17px;margin:6px 0 18px}.inspector-section{border-top:1px solid var(--line);padding:16px 0}.inspector-section:first-of-type{border-top:0;padding-top:0}.inspector-section h3{margin:0 0 10px;font-size:12px;color:var(--muted);font-weight:700}.definition{font-size:13px;line-height:1.7}.meta-row{display:grid;grid-template-columns:75px 1fr;gap:10px;padding:7px 0;font-size:12px;border-bottom:1px solid var(--line)}.meta-row:last-child{border-bottom:0}.meta-row dt{color:var(--muted)}.meta-row dd{margin:0;word-break:break-all}.meta-row code{font-size:10px;color:var(--muted)}.align-item{border:1px solid var(--line);padding:9px;margin-top:7px;border-radius:4px;background:var(--soft)}.align-item .relation-name{color:var(--muted);font-size:10px;display:block;margin-bottom:5px}.align-item strong{font-size:12px}.stat-strip{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:18px}.stat{background:var(--soft);padding:10px;border-radius:4px}.stat strong{display:block;font-size:17px}.stat span{color:var(--muted);font-size:10px}.loading{color:var(--muted);font-size:13px;padding:40px 0}.error{color:#934c42;background:#faece9;border:1px solid #e7c6c1;padding:12px;font-size:12px;line-height:1.6}
    .neighborhood-visual{margin-top:30px}.visual-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.visual-heading h3{margin:0;font-size:14px;font-weight:680}.visual-heading span{color:var(--muted);font-size:11px}.visual-tools{display:flex;gap:4px}.visual-tools button{width:28px;height:26px;border:1px solid var(--line);border-radius:3px;background:var(--white);color:var(--muted);font-size:15px;line-height:1}.visual-tools button:hover{border-color:var(--teal);color:var(--teal-dark)}.visual-frame{overflow:hidden;border:1px solid var(--line);border-radius:5px;background:linear-gradient(180deg,#fff 0%,#f7faf9 100%);box-shadow:0 3px 10px rgba(23,33,38,.025)}.visual-svg{display:block;width:100%;height:auto;min-height:330px}.visual-edge{stroke:#b7c6c5;stroke-width:1.5}.visual-edge.parent-edge{stroke:#8da6b9}.visual-edge.child-edge{stroke:#83b1a8}.visual-edge-label{fill:var(--muted);font-size:11px;text-anchor:middle}.visual-node{cursor:pointer}.visual-node rect{stroke-width:1.5}.visual-node.cnfo rect{fill:#e5f2f0;stroke:#5b9e97}.visual-node.current rect{fill:#116b68;stroke:#0c504e}.visual-node.current .visual-label,.visual-node.current .visual-local{fill:#fff}.visual-node:hover rect{stroke:#0c504e;stroke-width:2.5}.visual-label{fill:var(--ink);font-size:14px;font-weight:650;text-anchor:middle}.visual-local{fill:var(--muted);font-size:10px;text-anchor:middle}.visual-kind{fill:var(--muted);font-size:9px;letter-spacing:.06em;text-anchor:middle}.visual-node.current .visual-kind{fill:#d7efeb}.visual-legend{display:flex;gap:14px;align-items:center;margin-top:9px;color:var(--muted);font-size:10px}.legend-item{display:inline-flex;align-items:center;gap:5px}.legend-dot{width:9px;height:9px;border-radius:2px;display:inline-block}.legend-dot.cnfo{background:#5b9e97}.visual-loading{padding:30px;text-align:center;color:var(--muted);font-size:12px}.visual-error{padding:15px;color:#934c42;background:#faece9;font-size:12px}
    @media (max-width:1250px){body{min-width:960px}.workspace{grid-template-columns:260px minmax(500px,1fr) 290px}.main{padding-left:24px;padding-right:24px}}
    .relation-visual{margin-top:24px}.relation-edge{stroke:#9aaead;stroke-width:1.4}.relation-edge.incoming{stroke:#8099b7;stroke-dasharray:5 4}.relation-edge-label{fill:#526563;font-size:10px;text-anchor:middle}.relation-node circle{fill:#f6faf9;stroke:#5b9e97;stroke-width:1.6}.relation-node.incoming circle{fill:#edf2f8;stroke:#8ca3bd}.relation-node.current circle{fill:#116b68;stroke:#0c504e;stroke-width:2}.relation-node{cursor:pointer}.relation-node:hover circle{stroke:#0c504e;stroke-width:3}.relation-node:not(.current) .relation-label,.relation-node:not(.current) .relation-local,.relation-kind{opacity:0;pointer-events:none}.relation-node:not(.current):hover .relation-label,.relation-node:not(.current):hover .relation-local{opacity:1}.relation-label{fill:var(--ink);font-size:11px;font-weight:650;text-anchor:middle}.relation-local{fill:var(--muted);font-size:8px;text-anchor:middle}.relation-node.current .relation-label{fill:#fff;font-size:14px;font-weight:700}.relation-node.current .relation-local{fill:#d7efeb;font-size:9px}.relation-legend .legend-dot.relation{background:#5b9e97}.relation-legend .legend-dot.incoming{background:#8ca3bd}
    .relation-label{fill:#111;font-size:11px;font-weight:650;pointer-events:none;opacity:1;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.relation-node:not(.current) .relation-label,.relation-node.current .relation-label{opacity:1;fill:#111}.relation-node.current circle{fill:#e0f0ee;stroke:#116b68}.relation-node.current .relation-label{font-size:14px;font-weight:700}.relation-node:hover circle{stroke-width:2.5}
    .view-switch{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-right:5px}.view-switch button{border:0;border-right:1px solid var(--line);background:var(--white);color:var(--muted);padding:4px 9px;font-size:11px}.view-switch button:last-child{border-right:0}.view-switch button.active{background:var(--teal-soft);color:var(--teal-dark);font-weight:650}.main-tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin:12px 0 18px}.main-tabs button{border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);padding:9px 2px 10px;font-size:13px}.main-tabs button.active{border-bottom-color:var(--teal);color:var(--teal-dark);font-weight:680}.semantic-section{margin-top:22px}.semantic-section h3{font-size:14px;margin:0 0 10px;font-weight:680}.semantic-section .section-note{font-size:11px;color:var(--muted);margin:-4px 0 10px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.detail-card{border:1px solid var(--line);background:var(--white);border-radius:5px;padding:14px}.detail-card h4{margin:0 0 11px;font-size:12px;color:var(--muted);font-weight:700}.detail-card ul{list-style:none;padding:0;margin:0;display:grid;gap:7px}.detail-card li{font-size:12px;line-height:1.45}.detail-card li strong{font-weight:650}.detail-card li code{display:block;margin-top:3px;color:var(--muted);font-size:10px;word-break:break-all}.detail-link{border:0;background:transparent;color:var(--teal);padding:0;text-align:left;font-weight:650}.constraint-list{display:grid;gap:7px}.constraint-item{background:var(--soft);padding:9px 10px;border-radius:4px;font-size:12px}.constraint-item code{color:var(--muted);font-size:10px}.empty-block{padding:14px;background:var(--soft);color:var(--muted);font-size:12px;border-radius:4px}.mapping-row{display:grid;grid-template-columns:100px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}.mapping-row:last-child{border-bottom:0}.mapping-row .mapping-type{color:var(--muted);font-size:11px}
  </style>

<body>
  <div class="app-shell">
    <header class="topbar"><div class="brand"><div class="brand-mark">本</div><div><h1>中国基金本体浏览器</h1><p>CNFO · 独立基金领域 T-BOX</p></div></div><div class="status"><span class="status-dot"></span><span id="status-text">正在读取本体</span></div></header>
    <div class="workspace">
      <aside class="sidebar"><div class="eyebrow">Ontology index</div><div class="panel-title">查找概念</div><div class="search-box"><input id="search-input" type="search" placeholder="搜索中文名、英文名或 IRI" autocomplete="off"><span class="search-icon">⌕</span></div><div class="scope-tabs"><button class="active" data-scope="all">全部</button><button data-scope="cnfo">CNFO</button></div><div id="results" class="results"></div><div class="stat-strip"><div class="stat"><strong id="class-count">-</strong><span>类</span></div><div class="stat"><strong id="property-count">-</strong><span>属性</span></div></div></aside>
      <main class="main"><div id="breadcrumbs" class="breadcrumbs"></div><div class="main-tabs"><button class="active" data-main-view="semantic">语义详情</button><button data-main-view="graph">关系图</button></div><div id="content"><div class="loading">正在加载本体...</div></div><div id="visual-root" hidden></div></main>
      <aside class="inspector"><div class="eyebrow">Class inspector</div><h2>概念详情</h2><div id="inspector-content" class="loading">选择一个类查看定义。</div></aside>
    </div>
  </div>
  <script>
    const CNFO_FUND = 'https://ontology.example.cn/cnfo/ontology/Fund';
    let activeScope = 'all'; let activeIri = ''; let searchTimer = null;
    const $ = id => document.getElementById(id);
    const esc = value => String(value == null ? '' : value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const sourceClass = source => source === 'CNFO' ? 'cnfo' : 'system';
    const sourcePill = source => '<span class="source-pill ' + sourceClass(source) + '">' + esc(source) + '</span>';
    const encodeIri = iri => encodeURIComponent(iri);
    let visualZoom = 1;
    let viewMode = 'circle';
    let mainView = 'semantic';
    async function getJson(url){const response=await fetch(url);if(!response.ok)throw new Error(await response.text()||'请求失败（'+response.status+'）');return response.json()}
    function circularNode(node,x,y,current,centerX,centerY){const radius=current?6:4;const rawLabel=String(node.label||node.local_name||node.iri||'未命名类');const label=rawLabel.length>16?rawLabel.slice(0,16)+'…':rawLabel;const angle=current?-Math.PI/2:Math.atan2(y-centerY,x-centerX);const textRadius=current?28:16;const textX=x+Math.cos(angle)*textRadius;const textY=y+Math.sin(angle)*textRadius;const anchor=current?'middle':Math.abs(Math.cos(angle))<.25?'middle':Math.cos(angle)>0?'start':'end';return '<g class="relation-node '+sourceClass(node.source)+(current?' current':'')+'" data-iri="'+esc(node.iri)+'"><circle cx="'+x+'" cy="'+y+'" r="'+radius+'"></circle><text class="relation-label" x="'+textX+'" y="'+textY+'" text-anchor="'+anchor+'" dominant-baseline="middle">'+esc(label)+'</text><title>'+esc(rawLabel)+'&#10;'+esc(node.iri)+'</title></g>'}
    function relationPredicateName(relation){const predicate=String(relation.predicate||'');const local=predicate.replace(/[#/]$/,'').split('#').pop().split('/').pop();return local||relation.label||'relatedTo'}
    function relationDisplayLabel(relation){return relation.label==='subClassOf'? 'subClassOf' : relationPredicateName(relation)}
    function groupRelations(detail){const grouped=new Map();(detail.relations||[]).forEach(relation=>{if(!relation.target||!relation.target.is_class)return;const key=relation.target.iri;const item=grouped.get(key)||{target:relation.target,labels:[],titles:[],incoming:false};const label=relationDisplayLabel(relation);if(!item.labels.includes(label))item.labels.push(label);const title=relation.label_zh&&relation.label_zh!==label?label+' · '+relation.label_zh:label;if(!item.titles.includes(title))item.titles.push(title);item.incoming=item.incoming||relation.direction==='incoming';grouped.set(key,item)});return Array.from(grouped.values())}
    function renderCircular(detail,neighbors){const root=$('visual-root');if(!root)return;const current=detail.current;const width=1100;const height=Math.max(650,Math.min(900,520+neighbors.length*7));const centerX=width/2;const centerY=height/2;const radius=Math.min(width,height)/2-125;let body='';neighbors.forEach((item,index)=>{const angle=-Math.PI/2+(Math.PI*2*index/Math.max(neighbors.length,1));const x=centerX+Math.cos(angle)*radius;const y=centerY+Math.sin(angle)*radius;body+=circularEdge(centerX,centerY,x,y,item.labels.join(' · '),item.incoming,item.titles.join(' / '))+circularNode(item.target,x,y,false,centerX,centerY)});body+=circularNode(current,centerX,centerY,true,centerX,centerY);return renderVisualFrame(detail,neighbors,body,width,height,centerX,centerY,'圆形')}
    function renderTree(detail,neighbors){const root=$('visual-root');if(!root)return;const current=detail.current;const width=1100;const height=Math.max(480,neighbors.length*44+100);const currentX=145;const targetX=780;const centerY=height/2;const step=(height-90)/Math.max(neighbors.length,1);let body='';neighbors.forEach((item,index)=>{const y=neighbors.length===1?centerY:45+index*step;body+=circularEdge(currentX,centerY,targetX,y,item.labels.join(' · '),item.incoming,item.titles.join(' / '))+circularNode(item.target,targetX,y,false,currentX,centerY)});body+=circularNode(current,currentX,centerY,true,currentX,centerY);return renderVisualFrame(detail,neighbors,body,width,height,currentX,centerY,'树型')}
    function renderVisualFrame(detail,neighbors,body,width,height,centerX,centerY,mode){const root=$('visual-root');const offsetX=width*(1-visualZoom)/2;const offsetY=height*(1-visualZoom)/2;root.innerHTML='<section class="neighborhood-visual relation-visual"><div class="visual-heading"><div><h3>一层关系动态视图</h3><span>'+esc(mode)+' · 当前类 '+(mode==='圆形'?'居中':'在左')+' · '+neighbors.length+' 个邻近类 · 点击节点继续展开</span></div><div class="visual-tools"><div class="view-switch"><button class="'+(viewMode==='circle'?'active':'')+'" data-view-mode="circle">圆形</button><button class="'+(viewMode==='tree'?'active':'')+'" data-view-mode="tree">树型</button></div><button data-visual-action="zoom-out" title="缩小">−</button><button data-visual-action="zoom-reset" title="重置">100%</button><button data-visual-action="zoom-in" title="放大">+</button></div></div><div class="visual-frame"><svg class="visual-svg" viewBox="0 0 '+width+' '+height+'" role="img" aria-label="'+esc(detail.current.label)+' 的一层'+esc(mode)+'关系图"><g transform="translate('+offsetX+' '+offsetY+') scale('+visualZoom+')">'+body+'</g></svg></div><div class="visual-legend relation-legend"><span class="legend-item"><i class="legend-dot relation"></i>CNFO 本体关系</span><span>连线标签为关系名 · 类名位于圆点外侧</span></div></section>'}
    function renderCircularView(detail){const neighbors=groupRelations(detail);if(viewMode==='tree')return renderTree(detail,neighbors);return renderCircular(detail,neighbors)}
    function circularEdge(x1,y1,x2,y2,label,incoming,title){const mx=(x1+x2)/2;const my=(y1+y2)/2;const shown=label.length>35?label.slice(0,35)+'…':label;return '<line class="relation-edge '+(incoming?'incoming':'')+'" x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'"></line><text class="relation-edge-label" x="'+mx+'" y="'+(my-5)+'">'+esc(shown)+'</text><title>'+esc(title||label)+'</title>'}
    const renderContentBase = renderContent;
    function syncMainView(){const content=$('content');const root=$('visual-root');if(content)content.hidden=mainView==='graph';if(root)root.hidden=mainView!=='graph';const main=document.querySelector('.main');if(main)main.scrollTop=0;if(mainView==='graph'&&window.activeDetail)renderCircularView(window.activeDetail)}
    renderContent = function(detail){window.activeDetail=detail;renderSemantic(detail);syncMainView()};
    function nodeButton(node,kind){return '<button class="relation-card '+sourceClass(node.source)+'" data-iri="'+esc(node.iri)+'"><span class="relation-kind">'+esc(kind||(node.source==='CNFO'?'CNFO class':'ontology class'))+'</span><strong>'+esc(node.label)+'</strong><span class="arrow">›</span><small>'+esc(node.local_name)+' · '+esc(node.source)+'</small></button>'}
    function renderResults(results){if(!results.length){$('results').innerHTML='<div class="empty">没有找到匹配的类。试试“基金”“Fund”“ETF”或“公募基金”。</div>';return}$('results').innerHTML=results.map(node=>'<button class="result-item '+(node.iri===activeIri?'selected':'')+'" data-iri="'+esc(node.iri)+'"><span class="result-label">'+esc(node.label)+'</span><span class="result-meta">'+sourcePill(node.source)+'<span>'+esc(node.local_name)+'</span></span></button>').join('')}
    async function search(query){try{const data=await getJson('/api/ontology/search?q='+encodeURIComponent(query||'')+'&scope='+activeScope+'&limit=40');renderResults(data.results)}catch(error){$('results').innerHTML='<div class="error">'+esc(error.message)+'</div>'}}
    function renderBreadcrumbs(detail){const parent=(detail.parents||[]).find(item=>item.source==='CNFO')||(detail.parents||[])[0];$('breadcrumbs').innerHTML='<button data-iri="'+CNFO_FUND+'">本体首页</button><span>/</span>'+(parent?'<button data-iri="'+esc(parent.iri)+'">'+esc(parent.label)+'</button><span>/</span>':'')+'<span class="current">'+esc(detail.current.label)+'</span>'}
    function renderInspector(detail){const current=detail.current;const alignments=detail.alignments||[];const labels=(detail.labels||[]).slice(0,6).map(item=>'<div class="meta-row"><dt>标签</dt><dd>'+esc(item.value)+(item.language?' <code>@'+esc(item.language)+'</code>':'')+'</dd></div>').join('');const relations=alignments.length?alignments.map(item=>'<div class="align-item"><span class="relation-name">'+esc(item.relation)+'</span><button class="property-link" data-iri="'+esc(item.target.iri)+'"><strong>'+esc(item.target.label)+'</strong></button><br><code>'+esc(item.target.iri)+'</code></div>').join(''):'<div class="empty">当前类没有声明对齐关系。</div>';$('inspector-content').innerHTML='<div class="inspector-section"><div class="definition">'+esc(current.definition||'暂无中文定义。')+'</div></div><div class="inspector-section"><h3>标识信息</h3><dl><div class="meta-row"><dt>来源层</dt><dd>'+sourcePill(current.source)+'</dd></div><div class="meta-row"><dt>本地名</dt><dd>'+esc(current.local_name)+'</dd></div><div class="meta-row"><dt>IRI</dt><dd><code>'+esc(current.iri)+'</code></dd></div>'+labels+'</dl></div><div class="inspector-section"><h3>对齐关系</h3>'+relations+'</div>'}
    function propertyRows(items,title){if(!items.length)return'<tr><th>'+esc(title)+'</th><td class="empty">暂无直接属性</td></tr>';return items.map(item=>'<tr><th>'+esc(title)+'</th><td><strong>'+esc(item.label)+'</strong><br><span class="result-meta">'+sourcePill(item.source)+' '+esc(item.type)+' property</span><div style="margin-top:7px;color:var(--muted);font-size:11px">'+esc(item.local_name)+'</div></td></tr>').join('')}
    function renderContent(detail){const current=detail.current;const parents=detail.parents||[];const children=detail.children||[];const props=detail.properties||{outgoing:[],incoming:[]};$('content').innerHTML='<div class="hero"><div><div class="eyebrow">Current class</div><h2>'+esc(current.label)+'</h2><div class="identity-line">'+sourcePill(current.source)+'<code>'+esc(current.iri)+'</code></div><p>'+esc(current.definition||'暂无中文定义。')+'</p></div><div class="hero-actions"><button class="quiet-button" id="copy-iri">复制 IRI</button><button class="quiet-button" id="home-button">回到基金</button></div></div><div class="notice">当前只展示 <strong>'+esc(current.label)+'</strong> 的直接父类和直接子类。点击任意类卡片即可把它切换为新的中心类，再继续向下浏览。</div><section class="section"><div class="section-head"><h3>直接父类</h3><span>'+parents.length+' 个</span></div>'+(parents.length?'<div class="relation-grid">'+parents.map(node=>nodeButton(node,'直接父类')).join('')+'</div>':'<div class="empty-relation">这是当前层级的根类，未声明直接父类。</div>')+'</section><section class="section"><div class="section-head"><h3>直接子类</h3><span>'+children.length+' 个</span></div>'+(children.length?'<div class="relation-grid">'+children.map(node=>nodeButton(node,'直接子类')).join('')+'</div>':'<div class="empty-relation">当前类没有直接子类，或它是领域中的叶类。</div>')+'</section><section class="section"><div class="section-head"><h3>直接属性</h3><span>'+((props.outgoing||[]).length+(props.incoming||[]).length)+' 个</span></div><table class="property-table"><tbody>'+propertyRows(props.outgoing||[],'定义域')+propertyRows(props.incoming||[],'值域')+'</tbody></table></section>';$('copy-iri').addEventListener('click',()=>navigator.clipboard&&navigator.clipboard.writeText(current.iri).then(()=>{$('copy-iri').textContent='已复制';setTimeout(()=>$('copy-iri').textContent='复制 IRI',1200)}));$('home-button').addEventListener('click',()=>loadClass(CNFO_FUND))}
    function detailItem(item){const node=item.target||item;return '<li><button class="detail-link" data-iri="'+esc(node.iri)+'">'+esc(node.label||node.local_name)+'</button>'+(item.relation?'<span> · '+esc(item.relation)+'</span>':'')+(node.iri?'<code>'+esc(node.iri)+'</code>':'')+'</li>'}
    function propertyList(items){if(!items||!items.length)return '<div class="empty-block">暂无</div>';return '<ul>'+items.map(item=>'<li><strong>'+esc(item.local_name||item.label)+'</strong><span> → '+esc((item.ranges&&item.ranges[0]&&item.ranges[0].label)||(item.domains&&item.domains[0]&&item.domains[0].label)||'未声明值域')+'</span>'+(item.inferred?'<span class="inferred-badge">继承'+(item.inherited_from?' · '+esc(item.inherited_from.label):'')+'</span>':'<span class="direct-badge">直接</span>')+'<code>'+esc(item.iri)+'</code></li>').join('')+'</ul>'}
    function propertyCards(items){if(!items||!items.length)return '<div class="empty-block">暂无</div>';const direct=items.filter(item=>!item.inferred);const inherited=items.filter(item=>item.inferred);return (direct.length?'<div class="property-subgroup"><div class="subgroup-title">直接声明</div>'+propertyList(direct)+'</div>':'')+(inherited.length?'<div class="property-subgroup"><div class="subgroup-title">从父类继承</div>'+propertyList(inherited)+'</div>':'')}
    function renderSemantic(detail){const current=detail.current;const hierarchy=detail.hierarchy||{parents:detail.parents||[],children:detail.children||[]};const objectProps=detail.object_properties||{outgoing:[],incoming:[]};const datatypeProps=detail.datatype_properties||{outgoing:[],incoming:[]};const mappings=detail.mappings||[];const constraints=detail.logical_constraints||[];const restrictions=detail.restrictions||[];const parentList=hierarchy.parents.length?'<ul>'+hierarchy.parents.map(detailItem).join('')+'</ul>':'<div class="empty-block">无直接父类</div>';const childList=hierarchy.children.length?'<ul>'+hierarchy.children.map(detailItem).join('')+'</ul>':'<div class="empty-block">无直接子类</div>';const mappingList=mappings.length?mappings.map(item=>'<div class="mapping-row"><span class="mapping-type">'+esc(item.relation)+'</span>'+detailItem(item).replace('<li>','<div>').replace('</li>','</div>')+'</div>').join(''):'<div class="empty-block">暂无本体映射</div>';const constraintList=constraints.length?'<div class="constraint-list">'+constraints.map(item=>'<div class="constraint-item"><strong>'+esc(item.relation)+'</strong> · <button class="detail-link" data-iri="'+esc(item.target.iri)+'">'+esc(item.target.label)+'</button></div>').join('')+'</div>':'<div class="empty-block">暂无互斥或逻辑约束</div>';const restrictionList=restrictions.length?'<div class="constraint-list">'+restrictions.map(item=>'<div class="constraint-item">'+esc(item.description)+(item.property&&item.property.iri?'<br><code>'+esc(item.property.iri)+'</code>':'')+(item.inherited?'<span class="inferred-badge">继承</span>':'')+'</div>').join('')+'</div>':'<div class="empty-block">暂无 OWL restriction</div>';$('content').innerHTML='<div class="hero"><div><div class="eyebrow">Class definition</div><h2>'+esc(current.label)+'</h2><div class="identity-line">'+sourcePill(current.source)+'<code>'+esc(current.iri)+'</code></div><p>'+esc(current.definition||'暂无中文定义。')+'</p></div><div class="hero-actions"><button class="quiet-button" id="copy-iri">复制 IRI</button><button class="quiet-button" id="home-button">回到基金</button></div></div><div class="semantic-section"><h3>Hierarchy</h3><div class="detail-grid"><div class="detail-card"><h4>Parents</h4>'+parentList+'</div><div class="detail-card"><h4>Children</h4>'+childList+'</div></div></div><div class="semantic-section"><h3>Object Properties</h3><p class="section-note">当前类直接声明或从父类继承的对象属性。</p><div class="detail-grid"><div class="detail-card"><h4>Outgoing</h4>'+propertyCards(objectProps.outgoing)+'</div><div class="detail-card"><h4>Incoming</h4>'+propertyCards(objectProps.incoming)+'</div></div></div><div class="semantic-section"><h3>Datatype Properties</h3><div class="detail-card">'+propertyCards([...(datatypeProps.outgoing||[]),...(datatypeProps.incoming||[])])+'</div></div><div class="semantic-section"><h3>Mappings</h3>'+mappingList+'</div><div class="semantic-section"><h3>Logical Constraints</h3>'+constraintList+'</div><div class="semantic-section"><h3>OWL Restrictions</h3>'+restrictionList+'</div>';$('copy-iri').addEventListener('click',()=>navigator.clipboard&&navigator.clipboard.writeText(current.iri).then(()=>{$('copy-iri').textContent='已复制';setTimeout(()=>$('copy-iri').textContent='复制 IRI',1200)}));$('home-button').addEventListener('click',()=>loadClass(CNFO_FUND))}
    function renderContent(detail){window.activeDetail=detail;renderSemantic(detail);syncMainView()}
    async function loadClass(iri){activeIri=iri;$('content').innerHTML='<div class="loading">正在读取这个类的一层关系...</div>';$('inspector-content').innerHTML='<div class="loading">正在读取概念详情...</div>';try{const detail=await getJson('/api/ontology/class?iri='+encodeIri(iri));renderBreadcrumbs(detail);renderContent(detail);renderInspector(detail);search($('search-input').value);$('status-text').textContent=detail.current.source+' · '+detail.current.label}catch(error){$('content').innerHTML='<div class="error">'+esc(error.message)+'</div>';$('inspector-content').innerHTML='' }}
    document.addEventListener('click',event=>{const mainMode=event.target.closest('[data-main-view]');if(mainMode){mainView=mainMode.dataset.mainView;document.querySelectorAll('[data-main-view]').forEach(item=>item.classList.toggle('active',item.dataset.mainView===mainView));syncMainView();return}const target=event.target.closest('[data-iri]');if(target){event.preventDefault();loadClass(target.dataset.iri)}const scope=event.target.closest('[data-scope]');if(scope){document.querySelectorAll('[data-scope]').forEach(item=>item.classList.remove('active'));scope.classList.add('active');activeScope=scope.dataset.scope;search($('search-input').value)}});
    $('search-input').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>search($('search-input').value),180)});
    document.addEventListener('click',event=>{const mode=event.target.closest('[data-view-mode]');if(mode){viewMode=mode.dataset.viewMode;if(window.activeDetail)renderCircularView(window.activeDetail);return}const action=event.target.closest('[data-visual-action]');if(!action)return;const name=action.dataset.visualAction;if(name==='zoom-in')visualZoom=Math.min(1.6,visualZoom+.1);if(name==='zoom-out')visualZoom=Math.max(.6,visualZoom-.1);if(name==='zoom-reset')visualZoom=1;if(window.activeDetail)renderCircularView(window.activeDetail)});
    (async function init(){try{const summary=await getJson('/api/ontology/summary');$('class-count').textContent=summary.class_count.toLocaleString();$('property-count').textContent=summary.property_count.toLocaleString();await search('基金');await loadClass(CNFO_FUND)}catch(error){$('content').innerHTML='<div class="error">无法加载本体：'+esc(error.message)+'</div>';$('status-text').textContent='读取失败'}})();
  </script>
</body>
</html>
