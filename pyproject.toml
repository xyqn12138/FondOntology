[project]
name = "fondontology"
version = "0.1.0"
description = "Domestic financial ontology foundation based on FIBO and Semantica"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rdflib>=7.6.0",
    "semantica[explorer]>=0.6.6",
]

[project.scripts]
fondontology = "fondontology.cli:main"
