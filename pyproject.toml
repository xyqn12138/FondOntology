[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fondontology"
version = "0.1.0"
description = "Independent China fund ontology with an OWL 2 RL viewer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rdflib>=7.6.0",
    "owlrl>=7.1.4",
    "semantica[explorer]>=0.6.6",
]

[project.scripts]
fondontology = "fondontology.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["fondontology"]
